repos:
  - repo: local
    hooks:
      - id: django-migrations-check
        name: django makemigrations --check
        entry: python manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        files: (models\.py|migrations/.*\.py)$
      - id: frontend-eslint
        name: eslint (frontend)
        entry: frontend/node_modules/.bin/eslint --max-warnings=0
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
      - id: frontend-prettier
        name: prettier (frontend)
        entry: frontend/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^frontend/src/
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
