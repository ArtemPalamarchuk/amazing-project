repos:
  - repo: local
    hooks:
      - id: django-migrations-check
        name: django makemigrations --check
        entry: python manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        files: (models\.py|migrations/.*\.py)$
      - id: frontend-eslint
        name: eslint (frontend)
        entry: frontend/node_modules/.bin/eslint --max-warnings=0
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
      - id: frontend-prettier
        name: prettier (frontend)
        entry: frontend/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^frontend/src/
